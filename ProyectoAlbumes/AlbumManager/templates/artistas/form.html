{% extends "base.html" %}
{% block title %}{{ accion }} Artista{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">{{ accion }} Artista</h2>

    <form method="post" class="row g-3">
        {% csrf_token %}

        <div class="col-md-4">
            <label class="form-label">Nombre</label>
            {{ form.nombre }}
        </div>

        <div class="col-md-4">
            <label class="form-label">País</label>
            {{ form.pais }}
        </div>

        <div class="col-md-4">
            <label class="form-label">Género</label>
            {{ form.genero }}
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'lista_artistas' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
