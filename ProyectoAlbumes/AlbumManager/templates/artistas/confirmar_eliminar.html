{% extends "base.html" %}
{% block title %}{{ accion }} Artista{% endblock %}
{% block content %}
<h2>{{ accion }} Artista</h2>
<form method="post" class="row g-3">
    {% csrf_token %}
    <div class="col-md-6">
        <label class="form-label">Nombre</label>
        {{ form.nombre|add_class:"form-control" }}
    </div>
    <div class="col-md-6">
        <label class="form-label">País</label>
        {{ form.pais|add_class:"form-control" }}
    </div>
    <div class="col-md-6">
        <label class="form-label">Género</label>
        {{ form.genero|add_class:"form-control" }}
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-success">{{ accion }}</button>
        <a href="{% url 'lista_artistas' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
