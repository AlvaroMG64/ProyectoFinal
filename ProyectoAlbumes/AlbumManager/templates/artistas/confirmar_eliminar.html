{% extends "base.html" %}
{% block title %}Eliminar Artista{% endblock %}
{% block content %}
<h2>Eliminar Artista</h2>
<p>¿Estás seguro de que quieres eliminar el artista <strong>"{{ artista.nombre }}"</strong>?</p>
{% if mensaje_cascada %}
    <p class="text-danger">{{ mensaje_cascada }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'lista_artistas' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
