{% extends "base.html" %}
{% block title %}Eliminar Álbum{% endblock %}
{% block content %}
<h2>Eliminar Álbum</h2>
<p>¿Estás seguro de que quieres eliminar el álbum <strong>"{{ album.titulo }}"</strong>?</p>
{% if mensaje_cascada %}
    <p class="text-danger">{{ mensaje_cascada }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'lista_albumes' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
