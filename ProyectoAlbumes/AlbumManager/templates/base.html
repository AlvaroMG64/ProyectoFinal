<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AlbumManager{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'dashboard' %}">
                <i class="bi bi-music-note-beamed"></i>
                AlbumManager
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'lista_albumes' %}">Álbumes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'lista_artistas' %}">Artistas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'lista_canciones' %}">Canciones</a></li>
                </ul>
                <ul class="navbar-nav align-items-center">
                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <span class="nav-link mb-0">Hola, {{ user.username }}</span>
                        </li>

                        <li class="nav-item">
                            <form action="{% url 'logout' %}" method="post" class="mb-0">
                                {% csrf_token %}
                                <button type="submit"
                                        class="nav-link btn btn-link text-danger fw-bold p-0 m-0"
                                        style="text-decoration: none;">
                                    Cerrar sesión
                                </button>
                            </form>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 position-fixed bottom-0 w-100">
        &copy; 2026 Álvaro Mozo Gaspar - AlbumManager
    </footer>
</body>
</html>
