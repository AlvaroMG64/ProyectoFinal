{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
    <div class="card w-75">
        <div class="card-body text-center">
            <h1 class="card-title mb-4">Dashboard</h1>
            <p class="mb-2"><strong>Usuario:</strong> {{ usuario.username }}</p>
            <p class="mb-4"><strong>Fecha y hora actuales:</strong> {{ hora_actual|date:"d/m/Y H:i" }}</p>

            <hr>

            <h5>Reglas de negocio</h5>
            <ul class="list-group list-group-flush mt-3">
                {% for regla in mensaje_reglas %}
                <li class="list-group-item text-danger">{{ regla }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endblock %}
