{% extends 'index.html' %}
{% block title %}{{ accion }} Canción{% endblock %}

{% block content %}
<div class="card card-form mt-5">
    <h3 class="text-center mb-4">{{ accion }} Canción</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100">{{ accion }}</button>
    </form>
</div>
{% endblock %}
