{% extends "base.html" %}
{% block title %}{{ accion }} Canción{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">{{ accion }} Canción</h2>

    <form method="post" class="row g-3">
        {% csrf_token %}

        <div class="col-md-6">
            <label class="form-label">Título</label>
            {{ form.titulo }}
        </div>

        <div class="col-md-6">
            <label class="form-label">Álbum</label>
            {{ form.album }}
        </div>

        <div class="col-md-6">
            <label class="form-label">Duración (segundos)</label>
            {{ form.duracion }}
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'lista_canciones' %}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
