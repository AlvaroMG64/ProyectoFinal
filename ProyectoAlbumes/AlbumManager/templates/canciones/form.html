{% extends "base.html" %}
{% block title %}{{ accion }} Canción{% endblock %}
{% block content %}
<h2>{{ accion }} Canción</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-success">{{ accion }}</button>
    <a href="{% url 'lista_canciones' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
