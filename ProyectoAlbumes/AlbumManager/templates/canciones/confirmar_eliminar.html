{% extends "base.html" %}
{% block title %}Eliminar Canción{% endblock %}
{% block content %}
<h2>Eliminar Canción</h2>
<p>¿Estás seguro de que quieres eliminar la canción <strong>"{{ cancion.titulo }}"</strong>?</p>
{% if mensaje_cascada %}
    <p class="text-danger">{{ mensaje_cascada }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'lista_canciones' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
