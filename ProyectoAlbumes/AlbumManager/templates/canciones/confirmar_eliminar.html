{% extends "base.html" %}
{% block title %}Eliminar Canción{% endblock %}
{% block content %}
<h2>Eliminar Canción</h2>
<p>¿Estás seguro que quieres eliminar "{{ obj.titulo }}"?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Eliminar</button>
    <a href="{% url 'lista_canciones' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
